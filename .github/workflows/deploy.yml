name: Deploy

on:
  push:
    branches: [main]
  schedule:
    # Every Monday 06:00 UTC — keeps the GitHub activity graph on the home
    # page from going stale between manual deploys.
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
